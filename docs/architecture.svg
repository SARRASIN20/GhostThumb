<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">How GhostThumb works</title>
  <desc id="desc">An AI agent talks MCP to GhostThumb, which drives the phone through adb: the scrcpy server in control-only mode for the hands, screencap and uiautomator for the eyes, and an optional scrcpy window for the human.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .muted { fill: #59636e; }
      .bold { font-weight: 700; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="21" class="bold">How GhostThumb works</text>
  <text x="32" y="70" font-size="14" class="muted">The AI looks at the screen, decides, acts, then looks again. Nobody touches the phone.</text>

  <!-- AI agent -->
  <rect x="32" y="108" width="200" height="196" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="132" y="142" font-size="16" class="bold" text-anchor="middle">AI agent</text>
  <text x="132" y="162" font-size="12.5" class="muted" text-anchor="middle">any MCP client</text>
  <line x1="52" y1="178" x2="212" y2="178" stroke="#d0d7de"/>
  <text x="52" y="204" font-size="13">1 · look at the screen</text>
  <text x="52" y="230" font-size="13">2 · pick an element</text>
  <text x="52" y="256" font-size="13">3 · tap, type, scroll</text>
  <text x="52" y="282" font-size="13">4 · look again, verify</text>

  <!-- MCP link -->
  <line x1="236" y1="206" x2="322" y2="206" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="279" y="194" font-size="13" class="bold" text-anchor="middle">MCP</text>
  <text x="279" y="226" font-size="11" class="muted" text-anchor="middle">JSON-RPC</text>
  <text x="279" y="240" font-size="11" class="muted" text-anchor="middle">over stdio</text>

  <!-- GhostThumb -->
  <rect x="326" y="92" width="300" height="228" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="476" y="122" font-size="17" class="bold" text-anchor="middle" style="fill:#0969da">GhostThumb</text>
  <text x="476" y="141" font-size="12" class="muted" text-anchor="middle">Python · standard library only</text>
  <rect x="342" y="154" width="268" height="46" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="358" y="173" font-size="13" class="bold">Eyes</text>
  <text x="358" y="191" font-size="12" class="muted">screenshot + numbered UI elements</text>
  <rect x="342" y="208" width="268" height="46" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="358" y="227" font-size="13" class="bold">Hands</text>
  <text x="358" y="245" font-size="12" class="muted">taps, swipes, keys, text in any script</text>
  <rect x="342" y="262" width="268" height="46" rx="8" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="358" y="281" font-size="13" class="bold">Guard</text>
  <text x="358" y="299" font-size="12" class="muted">protected apps · action journal</text>

  <!-- adb link -->
  <line x1="630" y1="206" x2="716" y2="206" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="673" y="194" font-size="13" class="bold" text-anchor="middle">adb</text>
  <text x="673" y="226" font-size="11" class="muted" text-anchor="middle">USB or Wi-Fi</text>

  <!-- Phone -->
  <rect x="720" y="64" width="208" height="332" rx="30" fill="#24292f"/>
  <rect x="806" y="74" width="36" height="6" rx="3" fill="#57606a"/>
  <rect x="732" y="88" width="184" height="292" rx="18" fill="#f6f8fa"/>
  <rect x="744" y="102" width="160" height="124" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="824" y="126" font-size="13" class="bold" text-anchor="middle">scrcpy-server</text>
  <text x="824" y="146" font-size="12" text-anchor="middle">control only,</text>
  <text x="824" y="162" font-size="12" text-anchor="middle">no video stream</text>
  <text x="824" y="188" font-size="11" class="muted" text-anchor="middle">touch · keys · text</text>
  <text x="824" y="204" font-size="11" class="muted" text-anchor="middle">clipboard · start app</text>
  <rect x="744" y="238" width="160" height="128" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="824" y="264" font-size="13" class="bold" text-anchor="middle">screencap</text>
  <text x="824" y="284" font-size="13" class="bold" text-anchor="middle">uiautomator</text>
  <text x="824" y="312" font-size="11" class="muted" text-anchor="middle">pixels + UI tree,</text>
  <text x="824" y="328" font-size="11" class="muted" text-anchor="middle">read in parallel</text>

  <!-- Optional scrcpy window for the human -->
  <path d="M720 372 C 690 372, 668 385, 630 385" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="326" y="354" width="300" height="62" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="476" y="379" font-size="13" class="bold" text-anchor="middle">scrcpy window on the PC (optional)</text>
  <text x="476" y="399" font-size="12" class="muted" text-anchor="middle">watch live · take over with the mouse</text>
</svg>
